<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact Cape Crumb Bakery in Cape Town - fresh bread, croissants, cupcakes. Visit us or send a message.">
<meta name="keywords" content="Cape Crumb Bakery, contact, Cape Town bakery, fresh bread">
<title>Contact - Cape Crumb Bakery</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header style="background:#5D4037;padding:20px;color:white;"><b>Cape Crumb Bakery</b> | <a href="index.html" style="color:white;">Home</a> <a href="gallery.html" style="color:white;">Gallery</a> <a href="contact.html" style="color:white;">Contact</a></header>

<h1 style="text-align:center;">Contact Us</h1>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:20px;max-width:1000px;margin:auto;">
<div>
<form id="contactForm" style="display:flex;flex-direction:column;gap:10px;">
<input type="text" id="name" placeholder="Name" required style="padding:10px;">
<input type="email" id="email" placeholder="Email" required style="padding:10px;">
<textarea id="message" placeholder="Message" required style="padding:10px;height:100px;"></textarea>
<button type="submit" style="background:#5D4037;color:white;padding:10px;border:none;cursor:pointer;">Send</button>
<p id="formMsg" style="color:green;"></p>
</form>
</div>
<div>
<h3>Find Us</h3>
<p>123 Long Street, Cape Town, 8000</p>
<iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3310.2!2d18.4241!3d-33.9249!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2sCape%20Town!5e0!3m2!1sen!2sza!4v1" width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
</div>
</div>

<script>
document.getElementById('contactForm').addEventListener('submit', function(e){
 e.preventDefault();
 const name = document.getElementById('name').value.trim();
 const email = document.getElementById('email').value.trim();
 const message = document.getElementById('message').value.trim();
 if(!name || !email || !message){ alert('Please fill in all fields'); return; }
 if(!email.includes('@')){ alert('Please enter valid email'); return; }
 document.getElementById('formMsg').innerText = 'Thank you '+name+'! Your message sent.';
 this.reset();
});
</script>

<footer style="background:#5D4037;padding:20px;color:white;text-align:center;">&copy; 2026 Cape Crumb Bakery</footer>
</body>
</html>
