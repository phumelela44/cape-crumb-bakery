<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header style="background:brown;padding:20px;color:white;">Cape Crumb Bakery | <a href="index.html" style="color:white;">Home</a> <a href="gallery.html" style="color:white;">Gallery</a> <a href="contact.html" style="color:white;">Contact</a></header>
<h1 style="text-align:center;">Our Bakery Gallery</h1>
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:20px;">
<img src="images/croissants.jpg" width="100%" class="gallery-img">
<img src="images/cupcakes.jpg" width="100%" class="gallery-img">
<img src="images/sourdough.jpg" width="100%" class="gallery-img">
<img src="images/croissants.jpg" width="100%" class="gallery-img">
<img src="images/cupcakes.jpg" width="100%" class="gallery-img">
<img src="images/sourdough.jpg" width="100%" class="gallery-img">
</div>
<div id="lightbox" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;"><img id="lightbox-img" style="max-width:90%;max-height:90%;"><span style="position:absolute;top:20px;right:30px;color:white;font-size:40px;cursor:pointer;" onclick="document.getElementById('lightbox').style.display='none'">&times;</span></div>
<script>
document.querySelectorAll('.gallery-img').forEach(img=>{img.onclick=()=>{document.getElementById('lightbox-img').src=img.src;document.getElementById('lightbox').style.display='flex';}});
</script>
<footer style="background:brown;padding:20px;color:white;text-align:center;">&copy; 2026 Cape Crumb Bakery</footer>
</body>
</html>
